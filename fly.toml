# Fly.io configuration for The Hum: the game page plus accounts, cloud saves and the noclip leaderboard.
# Steps, checks and the alternatives: docs/DEPLOYMENT.md. App names are global on Fly.io, so `fly launch
# --copy-config --name <your-name> --no-deploy` (or editing the line below) sets yours.
app = "the-hum"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  HOST = "0.0.0.0"
  PORT = "8080"
  DATA_DIR = "/data"
  TRUST_PROXY = "1"       # Fly's proxy terminates TLS and sets X-Forwarded-Proto / X-Forwarded-For
  REQUIRE_HTTPS = "1"

# The database is one SQLite file on this volume. Run exactly one machine: the server is a single instance
# (rate limits are in memory) and a volume belongs to one machine.
[mounts]
  source = "hum_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/api/health"
    [http_service.checks.headers]
      X-Forwarded-Proto = "https"   # the check reaches the machine directly; REQUIRE_HTTPS would refuse it otherwise

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
